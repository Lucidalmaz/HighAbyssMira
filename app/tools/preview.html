<script type="module">
import * as THREE from 'three';

import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const q = new URLSearchParams(location.search), name = q.get('a');

  const ax = new THREE.AxesHelper(R * .6); ax.position.copy(bb.min); s.add(ax);

</script></body></html>
